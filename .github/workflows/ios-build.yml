
name: Balans 6.1 iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - balans-6.1-ios

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Hamta projektet
        uses: actions/checkout@v4

      - name: Installera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installera beroenden
        run: npm install

      - name: Skapa iOS-projekt
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Bygg iOS-appen
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
