<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173e33">
  <title>Balans 6.1 – Starttest</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #ffffff !important;
      color: #173e33 !important;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Arial, sans-serif;
    }

    body {
      padding: max(50px, env(safe-area-inset-top)) 20px
               max(30px, env(safe-area-inset-bottom));
    }

    main {
      max-width: 520px;
      margin: 0 auto;
    }

    header {
      background: #173e33;
      color: white;
      padding: 28px 22px;
      border-radius: 22px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 30px;
      margin: 0 0 8px;
    }

    h2 {
      font-size: 20px;
      margin: 0 0 12px;
    }

    p {
      line-height: 1.5;
    }

    .card {
      background: #f0f5f0;
      border: 1px solid #dbe5dc;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .success {
      color: #17623f;
      font-weight: bold;
      font-size: 18px;
    }

    button {
      background: #26654f;
      color: white;
      border: 0;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: bold;
      width: 100%;
    }

    #result {
      overflow-wrap: anywhere;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>Balans 6.1</h1>
      <p>TestFlight – diagnostik</p>
    </header>

    <section class="card">
      <h2>Test 1 – HTML</h2>
      <p class="success">
        HTML har laddats!
      </p>
      <p>
        Om du ser denna text fungerar visningen
        av appens HTML-sida.
      </p>
    </section>

    <section class="card">
      <h2>Test 2 – JavaScript</h2>
      <p id="js-status">
        Väntar på JavaScript...
      </p>
      <button type="button" id="test-button">
        Testa JavaScript
      </button>
    </section>

    <section class="card">
      <h2>Test 3 – Capacitor</h2>
      <p id="capacitor-status">
        Kontrollerar...
      </p>
    </section>

    <section class="card">
      <h2>Diagnostik</h2>
      <p id="result">
        Ingen testknapp tryckt.
      </p>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      var jsStatus =
        document.getElementById("js-status");

      var capacitorStatus =
        document.getElementById("capacitor-status");

      var result =
        document.getElementById("result");

      jsStatus.textContent =
        "JavaScript har startat!";

      capacitorStatus.textContent =
        window.Capacitor
          ? "Capacitor finns tillgängligt."
          : "Capacitor hittades inte i webbsidan.";

      document.getElementById("test-button")
        .addEventListener("click", function () {
          result.textContent =
            "Knappen fungerar! " +
            new Date().toLocaleString("sv-SE");
        });
    })();
  </script>
</body>
</html>
